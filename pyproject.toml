[project]
name = "hft-bot-ml-showcase"
version = "2.0.0"
description = "Muestras de código verificables de HFT_BOT_ML (Python + C# / NinjaTrader 8)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["samples/python/tests"]
pythonpath = ["samples/python"]
addopts = "-q"
